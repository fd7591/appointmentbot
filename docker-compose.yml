services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: botfacturacion-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Passwo0rd11.,"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Passwo0rd11.," -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver_data:

name: Build & Deploy to appointmentbot.runasp.net

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore botFacturacion.sln

      - name: Build
        run: dotnet build botFacturacion.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/API/botFacturacion.API.csproj --configuration Release --no-build --output ./publish

      - name: Deploy via MSDeploy
        shell: pwsh
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (!(Test-Path $msdeploy)) {
            $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }
          & $msdeploy `
            -verb:sync `
            -source:contentPath="${{ github.workspace }}\publish" `
            -dest:contentPath="${{ secrets.MSDEPLOY_SITE }}",computerName="https://${{ secrets.MSDEPLOY_URL }}/msdeploy.axd?site=${{ secrets.MSDEPLOY_SITE }}",userName="${{ secrets.MSDEPLOY_USERNAME }}",password="${{ secrets.MSDEPLOY_PASSWORD }}",authType="Basic" `
            -allowUntrusted `
            -enableRule:AppOffline
